<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  </head>
  <body>
    <div
      id="fixed-stage-root"
      data-composition-id="studio-fixed-stage"
      data-start="0"
      data-duration="18"
      data-width="1920"
      data-height="1080"
      data-fps="30"
    >
      <div
        id="background-mount"
        data-composition-id="studio-background"
        data-composition-src="compositions/studio-background.html"
        data-start="0"
        data-duration="18"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="content-mount"
        data-composition-id="content"
        data-composition-src="compositions/content.html"
        data-start="0"
        data-duration="18"
        data-track-index="10"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="caption-mount"
        data-composition-id="caption-overlay"
        data-composition-src="compositions/caption-overlay.html"
        data-start="0"
        data-duration="18"
        data-track-index="100"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const rootTimeline = gsap.timeline({ paused: true });
      window.__timelines["studio-fixed-stage"] = rootTimeline;
    </script>
  </body>
</html>
